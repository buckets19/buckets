name = "buckets-server"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
routes = [ { pattern = "live.bucketsonline.site", custom_domain = true } ]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# free plan: SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
