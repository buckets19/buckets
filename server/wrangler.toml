name = "buckets-server"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
routes = [ { pattern = "live.bucketsonline.site", custom_domain = true } ]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# free plan: SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MM"
class_name = "Matchmaker"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GameRoom", "Matchmaker"]

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "Profiles"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Profiles"]
